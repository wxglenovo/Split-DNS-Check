name: 分片 & DNS 检查

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      part:
        description: '手动验证指定分片 1~16'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
      TOTAL_PARTS: 16

    steps:
      - name: 拉取代码库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install --upgrade requests dnspython msgpack

      - name: 初始化 dist 文件夹和二进制文件
        run: |
          mkdir -p dist logs tmp
          chmod -R 777 dist
          python3 - <<EOF
import os, pickle

files = ['delete_counter.bin','not_written_counter.bin','hash_list.bin']
for f in files:
    path = os.path.join('dist', f)
    if not os.path.exists(path):
        pickle.dump({}, open(path,'wb'))
        print(f"✅ 已创建 {f}")
    else:
        print(f"ℹ️ {f} 已存在")

retry_file = os.path.join('dist','retry_rules.txt')
if not os.path.exists(retry_file):
    open(retry_file,'w',encoding='utf-8').close()
    print("✅ 已创建 retry_rules.txt")
else:
    print("ℹ️ retry_rules.txt 已存在")
EOF

      - name: 确保规则文件与分片存在
        run: |
          if [ ! -f "merged_rules.txt" ] || [ ! -f "tmp/part_01.txt" ]; then
            echo "⚠ 缺失规则文件，自动拉取"
            python3 split_and_check_16.py --force-update
          else
            echo "ℹ️ merged_rules.txt 和 tmp/part_01.txt 已存在"

      - name: 分片检测 & DNS 验证
        id: detect
        run: |
          LAST_PART_FILE="tmp/last_part.txt"
          PART_INPUT="${{ github.event.inputs.part }}"
          if [ -n "$PART_INPUT" ]; then
            PART="$PART_INPUT"
          else
            if [ -f "$LAST_PART_FILE" ]; then
              LAST_PART=$(cat "$LAST_PART_FILE")
              PART=$(( (LAST_PART % TOTAL_PARTS) + 1 ))
            else
              PART=1
            fi
          fi
          echo "$PART" > "$LAST_PART_FILE"
          echo "part=$PART" >> $GITHUB_OUTPUT
          echo "💻 本次处理分片: $PART"
          python3 split_and_check_16.py --part "$PART" | tee logs/split_check_part_${PART}.log || true

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dns-log-part-${{ steps.detect.outputs.part }}
          path: logs/
          if-no-files-found: warn

      - name: 提交并推送变更
        continue-on-error: true
        env:
          PART: ${{ steps.detect.outputs.part }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tmp/last_part.txt dist/*.bin dist/retry_rules.txt || true
          git add dist/validated_part_*.txt 2>/dev/null || true
          git commit -m "🤖 分片 $PART | 自动提交" || echo "ℹ️ 无变化，无需提交"
          git pull --rebase origin main || echo "⚠ pull失败（忽略）"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || echo "⚠ push失败（可能无变化）"
