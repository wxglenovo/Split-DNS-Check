name: Split & DNS Check

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
    - cron: "*/24 * * * *"
  workflow_dispatch:
    inputs:
      part:
        description: '手动验证指定分片 1~16'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
      TOTAL_PARTS: 16

    steps:
      - name: ✅ 拉取代码库（浅克隆）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: ✅ 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: ✅ 安装依赖
        run: pip install --upgrade requests dnspython msgpack

      - name: ✅ Git 配置
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "💻 当前 Git 配置："
          git config --global --list

      - name: ✅ 初始化 dist 文件夹和二进制计数器 & retry_rules.txt
        run: |
          mkdir -p dist logs tmp
          echo "📁 确保 dist/logs/tmp 文件夹存在"
          chmod -R 777 dist/
          for f in delete_counter.bin not_written_counter.bin; do
            if [ ! -f "dist/$f" ]; then
              python3 -c "import pickle; pickle.dump({}, open('dist/$f','wb'))"
              echo "✅ 已创建 $f"
            else
              echo "ℹ️ $f 已存在"
            fi
          done
          if [ ! -f dist/retry_rules.txt ]; then
            touch dist/retry_rules.txt
            echo "✅ 已创建 retry_rules.txt"
          else
            echo "ℹ️ retry_rules.txt 已存在"

      - name: ✅ 确保规则文件与分片存在
        run: |
          if [ ! -f "merged_rules.txt" ] || [ ! -f "tmp/part_01.txt" ]; then
            echo "⚠ 缺失规则文件，自动拉取"
            python3 split_and_check_16.py --force-update
          else
            echo "ℹ️ merged_rules.txt 和 tmp/part_01.txt 均已存在，无需拉取"

      - name: ✅ 强制生成 hash_list.bin
        run: |
          python3 - <<PYTHON
import os
import pickle
import hashlib

rules_file = "merged_rules.txt"
hash_file = "dist/hash_list.bin"

if os.path.exists(rules_file):
    with open(rules_file,"r",encoding="utf-8") as f:
        rules = f.read().splitlines()
    hashes = [hashlib.md5(r.encode("utf-8")).hexdigest() for r in rules]
    pickle.dump(hashes, open(hash_file,"wb"))
    print(f"✅ 已生成 hash_list.bin，共 {len(hashes)} 条规则")
else:
    print(f"⚠ {rules_file} 不存在，无法生成 hash_list.bin")
PYTHON

      - name: ✅ hash_list.bin 预览
        run: python3 -c "import pickle; print(pickle.load(open('dist/hash_list.bin','rb'))[:5])"

      - name: ✅ 分片检测 & DNS 验证（固定80线程，每批540条）
        id: detect
        run: |
          LAST_PART_FILE="tmp/last_part.txt"
          PART_INPUT="${{ github.event.inputs.part }}"
          if [ -n "$PART_INPUT" ]; then
            PART="$PART_INPUT"
          else
            if [ -f "$LAST_PART_FILE" ]; then
              LAST_PART=$(cat "$LAST_PART_FILE")
              PART=$(( (LAST_PART % TOTAL_PARTS) + 1 ))
            else
              PART=1
            fi
          fi
          echo "$PART" > "$LAST_PART_FILE"
          echo "part=$PART" >> $GITHUB_OUTPUT
          echo "💻 本次处理分片: $PART"
          python3 split_and_check_16.py --part "$PART" | tee logs/split_check_part_${PART}.log || true

      - name: ✅ 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dns-log-part-${{ steps.detect.outputs.part }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14

      - name: ✅ 提交并推送变更
        continue-on-error: true
        env:
          PART: ${{ steps.detect.outputs.part }}
        run: |
          set +e
          if [ -f logs/split_check_part_${PART}.log ]; then
            STATS=$(grep "COMMIT_STATS" logs/split_check_part_${PART}.log | tail -n1 | sed 's/COMMIT_STATS: //')
          else
            echo "ℹ️ 日志文件不存在"
            STATS="无日志"
          fi
          echo "📦 准备提交文件:"
          ls -l dist || echo "⚠ dist 不存在"
          git add tmp/last_part.txt dist/delete_counter.bin dist/not_written_counter.bin merged_rules.txt || true
          git add dist/retry_rules.txt 2>/dev/null || true
          git add dist/validated_part_*.txt 2>/dev/null || true
          git commit -m "🤖 分片 $PART | $STATS" || echo "ℹ️ 无变化，无需提交"
          git pull --rebase origin main || echo "⚠ pull失败（忽略）"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || echo "⚠ push失败（可能无变化）"
          set -e
