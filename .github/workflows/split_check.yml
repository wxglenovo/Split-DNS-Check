name: Split & DNS Check

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      part:
        description: '手动验证指定分片 1~16'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
      TOTAL_PARTS: 16

    steps:
      - name: ✅ 拉取代码库（浅克隆）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: ✅ 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: ✅ 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade requests dnspython msgpack

      - name: ✅ Git 配置
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --list

      - name: ✅ 初始化 dist/logs/tmp 文件夹和计数器
        run: |
          mkdir -p dist logs tmp
          chmod -R 777 dist || true

          # 创建 msgpack 空 dict 文件（delete_counter.bin & not_written_counter.bin）
          python - <<'PY'
import msgpack, os
for fname in ("dist/delete_counter.bin","dist/not_written_counter.bin"):
    dname = os.path.dirname(fname)
    if dname and not os.path.exists(dname):
        os.makedirs(dname, exist_ok=True)
    if not os.path.exists(fname):
        with open(fname,"wb") as f:
            f.write(msgpack.packb({}, use_bin_type=True))
        print("created", fname)
    else:
        print("exists", fname)
# retry file
if not os.path.exists("dist/retry_rules.txt"):
    open("dist/retry_rules.txt","w",encoding="utf-8").close()
    print("created dist/retry_rules.txt")
else:
    print("dist/retry_rules.txt exists")
# hash_list.bin as empty list (pickle) to be compatible with some scripts that use pickle
import pickle
if not os.path.exists("dist/hash_list.bin"):
    pickle.dump([], open("dist/hash_list.bin","wb"))
    print("created dist/hash_list.bin")
else:
    print("dist/hash_list.bin exists")
PY

      - name: ✅ 更新 hash_list.bin（若 merged_rules.txt 存在则同步）
        if: always()
        run: |
          python - <<'PY'
import os, pickle, hashlib
hash_file = 'dist/hash_list.bin'
rules_file = 'merged_rules.txt'

# ensure hash_file exists and is a list
if not os.path.exists(hash_file):
    pickle.dump([], open(hash_file,'wb'))

try:
    existing = pickle.load(open(hash_file,'rb'))
    if not isinstance(existing, list):
        existing = []
except Exception:
    existing = []
    pickle.dump(existing, open(hash_file,'wb'))

if os.path.exists(rules_file):
    with open(rules_file, 'r', encoding='utf-8') as f:
        rules = [r.strip() for r in f if r.strip()]
else:
    rules = []

# Use md5 for compactness, skip duplicates
existing_set = set(existing)
new = []
for r in rules:
    h = hashlib.md5(r.encode('utf-8')).hexdigest()
    if h not in existing_set:
        new.append(h)
        existing_set.add(h)

all_hashes = list(existing_set)
pickle.dump(all_hashes, open(hash_file,'wb'))
print("hash_list updated: +%d, total=%d" % (len(new), len(all_hashes)))
if len(all_hashes)>0:
    print("sample:", all_hashes[:5])
PY

      - name: ✅ 打印 .bin 文件统计
        run: |
          if [ -f scripts/print_bin_stats.py ]; then
            python3 scripts/print_bin_stats.py || true
          else
            echo "scripts/print_bin_stats.py not found"
          fi

      - name: ✅ 确保规则文件与分片存在（必要时强制更新）
        run: |
          if [ ! -f "merged_rules.txt" ] || [ ! -f "tmp/part_01.txt" ]; then
            echo "missing merged_rules.txt or tmp/part_01.txt - call force-update"
            python3 split_and_check_16.py --force-update || true
          else
            echo "merged_rules.txt and tmp/part_01.txt exist"
          fi

      - name: ✅ 分片检测 & DNS 验证（固定80线程，每批540条）
        id: detect
        run: |
          LAST_PART_FILE="tmp/last_part.txt"
          PART_INPUT="${{ github.event.inputs.part }}"
          if [ -n "$PART_INPUT" ]; then
            PART="$PART_INPUT"
          else
            if [ -f "$LAST_PART_FILE" ]; then
              LAST_PART=$(cat "$LAST_PART_FILE")
              PART=$(( (LAST_PART % TOTAL_PARTS) + 1 ))
            else
              PART=1
            fi
          fi
          echo "$PART" > "$LAST_PART_FILE"
          echo "part=$PART" >> $GITHUB_OUTPUT
          echo "processing part: $PART"
          python3 split_and_check_16.py --part "$PART" | tee logs/split_check_part_${PART}.log || true

      - name: ✅ 上传日志 (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dns-log-part-${{ steps.detect.outputs.part }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14

      - name: ✅ 提交并推送变更（容忍冲突）
        continue-on-error: true
        env:
          PART: ${{ steps.detect.outputs.part }}
        run: |
          set +e
          LOGFILE="logs/split_check_part_${PART}.log"
          if [ -f "$LOGFILE" ]; then
            STATS=$(grep "COMMIT_STATS" "$LOGFILE" | tail -n1 | sed 's/COMMIT_STATS: //')
          else
            STATS="无日志"
          fi
          echo "准备提交 dist/*.bin dist/retry_rules.txt dist/validated_part_*.txt"
          git add tmp/last_part.txt dist/*.bin dist/retry_rules.txt dist/validated_part_*.txt 2>/dev/null || true
          git commit -m "🤖 分片 $PART | $STATS" || echo "no changes to commit"
          # try to rebase then push; if fails, skip to avoid failing workflow permanently
          git pull --rebase origin main || echo "pull --rebase failed, continuing"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || echo "push failed (likely no change or conflict)"
          set -e
