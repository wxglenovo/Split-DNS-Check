name: Split & DNS Check

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
    - cron: "*/24 * * * *"
  workflow_dispatch:
    inputs:
      part:
        description: '手动验证指定分片 1~16'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
      TOTAL_PARTS: 16

    steps:
      - name: ✅ 拉取代码库（浅克隆）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: ✅ 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: ✅ 安装依赖
        run: pip install --upgrade requests dnspython msgpack

      - name: ✅ Git 配置
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --list

      - name: ✅ 初始化 dist/logs/tmp 文件夹和计数器
        run: |
          mkdir -p dist logs tmp
          chmod -R 777 dist/
          for f in delete_counter.bin not_written_counter.bin; do
            if [ ! -f "dist/$f" ]; then
              python3 -c "import pickle; pickle.dump({}, open('dist/$f','wb'))"
              echo "✅ 已创建 $f"
            else
              echo "ℹ️ $f 已存在"
            fi
          done
          if [ ! -f dist/retry_rules.txt ]; then
            touch dist/retry_rules.txt
            echo "✅ 已创建 retry_rules.txt"
          else
            echo "ℹ️ retry_rules.txt 已存在"
          fi

      - name: ✅ 确保 hash_list.bin 存在并生成
        run: |
          python3 -c "
import os, pickle, hashlib
hash_file='dist/hash_list.bin'
rules_file='merged_rules.txt'
if not os.path.exists(hash_file):
    pickle.dump([], open(hash_file,'wb'))
    print('⚠ hash_list.bin 不存在，已创建空文件')
try:
    existing_hashes = set(pickle.load(open(hash_file,'rb')))
except:
    existing_hashes = set()
    pickle.dump([], open(hash_file,'wb'))
    print('⚠ hash_list.bin 损坏，已重置为空')
if os.path.exists(rules_file):
    with open(rules_file,'r',encoding='utf-8') as f:
        rules=f.read().splitlines()
else:
    rules=[]
    print('⚠ merged_rules.txt 不存在或为空')
new_hashes=[hashlib.md5(r.encode('utf-8')).hexdigest() for r in rules if hashlib.md5(r.encode('utf-8')).hexdigest() not in existing_hashes]
total_hashes=list(existing_hashes)+new_hashes
pickle.dump(total_hashes, open(hash_file,'wb'))
print(f'✅ hash_list.bin 已更新，新增 {len(new_hashes)} 条规则，总计 {len(total_hashes)} 条')
print('前 5 条 hash:', total_hashes[:5])
"

      - name: ✅ 打印 .bin 文件统计
        run: python3 scripts/print_bin_stats.py

      - name: ✅ 确保规则文件与分片存在
        run: |
          if [ -f "merged_rules.txt" ] && [ -f "tmp/part_01.txt" ]; then
            echo "ℹ️ merged_rules.txt 和 tmp/part_01.txt 均已存在，无需拉取"
          else
            echo "⚠ 缺失规则文件，自动拉取"
            python3 split_and_check_16.py --force-update

      - name: ✅ 分片检测 & DNS 验证
        id: detect
        run: |
          LAST_PART_FILE="tmp/last_part.txt"
          PART_INPUT="${{ github.event.inputs.part }}"
          if [ -n "$PART_INPUT" ]; then
            PART="$PART_INPUT"
          else
            if [ -f "$LAST_PART_FILE" ]; then
              LAST_PART=$(cat "$LAST_PART_FILE")
              PART=$(( (LAST_PART % TOTAL_PARTS) + 1 ))
            else
              PART=1
            fi
          fi
          echo "$PART" > "$LAST_PART_FILE"
          echo "part=$PART" >> $GITHUB_OUTPUT
          echo "💻 本次处理分片: $PART"
          python3 split_and_check_16.py --part "$PART" | tee logs/split_check_part_${PART}.log || true

      - name: ✅ 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dns-log-part-${{ steps.detect.outputs.part }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14

      - name: ✅ 提交并推送变更
        continue-on-error: true
        env:
          PART: ${{ steps.detect.outputs.part }}
        run: |
          set +e
          if [ -f logs/split_check_part_${PART}.log ]; then
            STATS=$(grep "COMMIT_STATS" logs/split_check_part_${PART}.log | tail -n1 | sed 's/COMMIT_STATS: //')
          else
            echo "ℹ️ 日志文件不存在"
            STATS="无日志"
          fi
          echo "📦 准备提交文件:"
          ls -l dist || echo "⚠ dist 不存在"
          git add tmp/last_part.txt dist/delete_counter.bin dist/not_written_counter.bin merged_rules.txt || true
          git add dist/retry_rules.txt 2>/dev/null || true
          git add dist/validated_part_*.txt 2>/dev/null || true
          git commit -m '🤖 分片 ${PART} | ${STATS}' || echo 'ℹ️ 无变化，无需提交'
          git pull --rebase origin main || echo '⚠ pull失败（忽略）'
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || echo '⚠ push失败（可能无变化）'
          set -e
