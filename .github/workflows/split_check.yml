name: Split & DNS Check

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      part:
        description: '手动验证指定分片 1~16'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
      TOTAL_PARTS: 16

    steps:
      - name: ✅ 拉取代码库（浅克隆）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: ✅ 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: ✅ 安装依赖
        run: pip install --upgrade requests dnspython msgpack

      - name: ✅ Git 配置
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "💻 当前 Git 配置："
          git config --global --list

      - name: ✅ 打印 .bin 文件统计
        run: python3 scripts/print_bin_stats.py

      - name: ✅ 初始化 dist 文件夹和二进制计数器 & retry_rules.txt
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p dist logs tmp
          chmod -R 777 dist/
          
          for f in delete_counter.bin not_written_counter.bin; do
            if [ ! -f "dist/$f" ]; then
              python3 -c "import pickle, os; os.makedirs('dist', exist_ok=True); \
with open('dist/$f','wb') as f: pickle.dump({}, f)"
              echo "✅ 已创建 $f"
            else
              echo "ℹ️ $f 已存在"
            fi
          done

          if [ ! -f dist/hash_list.bin ]; then
            python3 -c "import pickle, os; os.makedirs('dist', exist_ok=True); \
with open('dist/hash_list.bin','wb') as f: pickle.dump({}, f)"
            chmod 777 dist/hash_list.bin
            echo "✅ 已创建 hash_list.bin"
          else
            echo "ℹ️ hash_list.bin 已存在"
          fi

          if [ ! -f dist/retry_rules.txt ]; then
            touch dist/retry_rules.txt
            chmod 777 dist/retry_rules.txt
            echo "✅ 已创建 retry_rules.txt"
          else
            echo "ℹ️ retry_rules.txt 已存在"
          fi

          echo "dist/retry_rules.txt 内容预览（前5行）:"
          head -n 5 dist/retry_rules.txt || echo "⚠ 文件为空"

      - name: ✅ 确保规则文件与分片存在
        run: |
          if [ -f "merged_rules.txt" ] && [ -f "tmp/part_01.txt" ]; then
            echo "ℹ️ merged_rules.txt 和 tmp/part_01.txt 已存在"
          else
            echo "⚠ 缺失规则文件，自动拉取"
            python3 split_and_check_16.py --force-update
          fi
          
      - name: ✅ 分片检测 & DNS 验证
        id: detect
        run: |
          LAST_PART_FILE="tmp/last_part.txt"
          PART_INPUT="${{ github.event.inputs.part }}"
          if [ -n "$PART_INPUT" ]; then
            PART="$PART_INPUT"
          else
            if [ -f "$LAST_PART_FILE" ]; then
              LAST_PART=$(cat "$LAST_PART_FILE")
              PART=$(( (LAST_PART % TOTAL_PARTS) + 1 ))
            else
              PART=1
            fi
          fi
          echo "$PART" > "$LAST_PART_FILE"
          echo "part=$PART" >> $GITHUB_OUTPUT
          echo "💻 本次处理分片: $PART"
          python3 split_and_check_16.py --part "$PART" | tee logs/split_check_part_${PART}.log || true

      - name: ✅ 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dns-log-part-${{ steps.detect.outputs.part }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14

      - name: ✅ 提交并推送变更
        continue-on-error: true
        env:
          PART: ${{ steps.detect.outputs.part }}
        run: |
          set +e
          # 配置 Git 用户信息（防止 Author unknown）
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 提取日志统计
          if [ -f logs/split_check_part_${PART}.log ]; then
            STATS=$(grep "COMMIT_STATS" logs/split_check_part_${PART}.log | tail -n1 | sed 's/COMMIT_STATS: //')
          else
            STATS="无日志"
          fi
          echo "📦 准备提交文件:"
          ls -l dist || echo "⚠ dist 不存在"

          # 添加文件
          git add tmp/last_part.txt dist/delete_counter.bin dist/not_written_counter.bin merged_rules.txt || true
          git add dist/retry_rules.txt 2>/dev/null || true
          git add dist/validated_part_*.txt 2>/dev/null || true

          # 提交
          git commit -m "🤖 分片 $PART | $STATS" || echo "ℹ️ 无变化，无需提交"

          # 安全处理远程更新
          git fetch origin main
          git reset --soft origin/main
          git commit --allow-empty -m "🤖 sync with remote before push" || true

          # 推送
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main || echo "⚠ push失败（可能无变化）"

          set -e
