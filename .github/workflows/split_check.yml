name: Split & DNS Check

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      part:
        description: '手动验证指定分片 1~16'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
      TOTAL_PARTS: 16

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - run: pip install --upgrade requests dnspython msgpack

      - name: 初始化 dist/tmp/logs
        run: |
          mkdir -p dist tmp logs
          chmod -R 777 dist
          for f in delete_counter.bin not_written_counter.bin hash_list.bin; do
            if [ ! -f "dist/$f" ]; then
              python3 -c "import msgpack; f=open('dist/$f','wb'); f.write(msgpack.packb({},use_bin_type=True))"
            fi
          done
          if [ ! -f dist/retry_rules.txt ]; then touch dist/retry_rules.txt; fi

      - name: 确保规则文件
        run: |
          if [ ! -f "merged_rules.txt" ] || [ ! -f "tmp/part_01.txt" ]; then
            python3 split_and_check_16.py --force-update
          fi

      - name: 分片验证
        id: detect
        run: |
          LAST_FILE="tmp/last_part.txt"
          PART="${{ github.event.inputs.part }}"
          if [ -z "$PART" ]; then
            if [ -f "$LAST_FILE" ]; then
              LAST=$(cat "$LAST_FILE")
              PART=$(( (LAST % TOTAL_PARTS)+1 ))
            else
              PART=1
            fi
          fi
          echo "$PART" > "$LAST_FILE"
          echo "part=$PART" >> $GITHUB_OUTPUT
          python3 split_and_check_16.py --part "$PART" | tee logs/split_check_part_${PART}.log || true

      - name: 上传日志
        uses: actions/upload-artifact@v4
        with:
          name: dns-log-part-${{ steps.detect.outputs.part }}
          path: logs/
          retention-days: 14

      - name: 提交变更
        continue-on-error: true
        env:
          PART: ${{ steps.detect.outputs.part }}
        run: |
          set +e
          git add tmp/last_part.txt dist/*.bin dist/retry_rules.txt dist/validated_part_*.txt 2>/dev/null || true
          git commit -m "🤖 分片 $PART | 自动提交" || echo "ℹ️ 无变化"
          git pull --rebase origin main || true
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || echo "⚠ push失败"
          set -e
